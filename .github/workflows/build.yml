name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release for the version in hrmail/__init__.py"
        type: boolean
        default: false

permissions:
  contents: write  # needed to publish a Release on tags

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Tests
        run: python -m pytest -q

      - name: Fetch Mercury and Pat (pinned, sha256-checked)
        run: python tools/fetch_bins.py --dest bin

      - name: Build hr-mail.exe
        run: pyinstaller --noconfirm --windowed --name hr-mail hr_mail.py

      - name: Assemble release folder
        shell: pwsh
        run: |
          $out = "dist/hr-mail"
          Copy-Item -Recurse bin "$out/bin"
          Copy-Item -Recurse licenses "$out/licenses"
          Copy-Item README.md "$out/README.md"
          Copy-Item LICENSE "$out/licenses/hr-mail-GPL-3.0.txt"
          $appVersion = python -c "import hrmail; print(hrmail.__version__)"
          if ("${{ github.ref_type }}" -eq "tag") { $version = "${{ github.ref_name }}" }
          elseif ("${{ inputs.release }}" -eq "true") { $version = "v$appVersion" }
          else { $version = "dev-$("${{ github.sha }}".Substring(0,7))" }
          "VERSION=$version" | Out-File -Append $env:GITHUB_ENV
          Compress-Archive -Path $out -DestinationPath "hr-mail-$version-windows.zip"
          "ZIP_NAME=hr-mail-$version-windows.zip" | Out-File -Append $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: hr-mail-windows
          path: ${{ env.ZIP_NAME }}

      - name: Publish release (tags, or manual run with release=true)
        if: github.ref_type == 'tag' || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: hr-mail ${{ env.VERSION }}
          body_path: docs/release-notes.md
          files: ${{ env.ZIP_NAME }}
