name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # needed to publish a Release on tags

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Tests
        run: python -m pytest -q

      - name: Fetch Mercury and Pat (pinned, sha256-checked)
        run: python tools/fetch_bins.py --dest bin

      - name: Build hr-mail.exe
        run: pyinstaller --noconfirm --windowed --name hr-mail hr_mail.py

      - name: Assemble release folder
        shell: pwsh
        run: |
          $out = "dist/hr-mail"
          Copy-Item -Recurse bin "$out/bin"
          Copy-Item -Recurse licenses "$out/licenses"
          Copy-Item README.md "$out/README.md"
          Copy-Item LICENSE "$out/licenses/hr-mail-GPL-3.0.txt"
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "dev-$("${{ github.sha }}".Substring(0,7))" }
          Compress-Archive -Path $out -DestinationPath "hr-mail-$version-windows.zip"
          "ZIP_NAME=hr-mail-$version-windows.zip" | Out-File -Append $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: hr-mail-windows
          path: ${{ env.ZIP_NAME }}

      - name: Publish release (tags only)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
